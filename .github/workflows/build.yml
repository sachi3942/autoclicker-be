name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Find Project and Build APK
      run: |
        if [ -f "build.gradle" ]; then
          gradle assembleDebug
        else
          BUILD_DIR=$(find . -maxdepth 2 -name "build.gradle" -not -path "*/app/*" -exec dirname {} \; | head -n 1)
          echo "Building in directory: $BUILD_DIR"
          cd "$BUILD_DIR" && gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RouletteAutoClicker-APK
        path: "**/build/outputs/apk/debug/*.apk"
